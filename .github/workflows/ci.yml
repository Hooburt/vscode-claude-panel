name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: for f in *.js media/*.js test/*.js; do node --check "$f"; done

      - name: Unit tests
        run: npm test

      - name: Package
        run: npx --yes @vscode/vsce@4.0.0 package --out claude-sessions.vsix

      - name: List packaged files
        run: npx --yes @vscode/vsce@4.0.0 ls

      - uses: actions/upload-artifact@v4
        with:
          name: claude-sessions-vsix
          path: claude-sessions.vsix
